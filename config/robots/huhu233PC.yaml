# =============================================================
# ⚠ 重要约定（给后续修改者）：本文件所有参数均为必填，C++ 代码（RobotConfig.h /
#   RobotConfig.cpp）中不设任何默认值——缺段或缺字段时程序启动直接报错退出，
#   绝不静默采用默认值。新增/删除配置项时必须同步修改 include/common/RobotConfig.h
#   与 src/common/RobotConfig.cpp。
#
#   **唯一例外**：common.big_small_yaw 按 yaw 构型分为 single / big_small 两支，
#   只需填写当前 mode（构型开关）对应的那一支——两种构型的参数互不通用，写没用到的
#   那一份纯属冗余；当前构型那一支内部的字段依旧全部必填。（另一支若写了也会被
#   严格校验，避免残留半截配置。）
# =============================================================

# ════════════════════════════════════════════════════════════
# common — 两个流水线共用参数
# ════════════════════════════════════════════════════════════
common:
  # 两个流水线共用的提取帧最小延迟（秒，输出队列帧龄须达到该值后 tryPopFrame 才返回）
  min_delay_seconds: 0.1

  # ── 队列积压自适应额外延迟（可选功能，BacklogAdaptiveDelay，v6 PID 式 PI）──
  # 开启后：处理线程每次 tryPopFrame() 后统计除输出缓冲队列外各缓冲队列的积压
  # 总数（input + inter0..inter3），记为 non_output_backlog，据此自适应调整取帧
  # 线程（输入线程）的额外延迟，缓解流水线积压/丢帧。控制结构为
  # 「PI 直接输出 + 抗饱和」
  # 各字段含义（给后续修改者，改动后仅需重启程序，无需重新编译）：
  #   enabled                ：功能总开关（true 开启 / false 关闭）
  #   target_backlog         ：目标积压（设定点，须 >= 1）
  #   max_extra_delay_seconds：额外延迟上限（秒，须 >= 0）
  #   gain_p                 ：PI 比例增益（秒/单位积压，须 >= 0）：越大校正越
  #                            快但越容易抖。
  #   gain_i                 ：PI 积分增益（秒/单位积压/秒，须 >= 0）：决定
  #                            收敛到平衡点的速度（稳态延迟由它维持）。
  backlog_adaptive_delay:
    enabled: true                # 功能总开关
    target_backlog: 3            # 目标积压（设定点，建议 3）
    max_extra_delay_seconds: 0.05 # 额外延迟上限（秒）
    gain_p: 0.001             # PI 比例增益（秒/单位积压）
    gain_i: 0.01             # PI 积分增益（秒/单位积压/秒）

  # ── 推理进程启动策略（bool）──
  #   false：启动时由 launch_all.py 启动全部推理进程
  #     （armor_infer_process / power_rune_infer_process），无推理任务时在后台
  #     闲置（阻塞等待共享内存请求，不占 CPU）；
  #   true：仅启动当前流水线所需的推理进程（由主程序按需启动），切换流水线时
  #     立即关闭所有不再需要的进程（释放其 GPU 显存），再启动新流水线所需进程
  #     （新进程需重新编译模型，就绪前该流水线推理返回空结果，界面保持响应）。
  infer_process_lazy: false

  # ── 推理挂死强制重启时限（秒，>= 0；0 = 关闭）──
  # 推理客户端每次推理响应超时（2s）返回时，检测距上一次推理正常返回的间隔；
  # 若超过该时限（说明推理进程疑似挂死），则强制重启对应的推理进程
  # （SIGKILL 后重新启动并等待就绪，见 InferProcessManager::forceRestart）。
  # 建议大于模型编译/切换耗时（如 10s），避免切换期间误触发。
  infer_force_restart_timeout_sec: 10.0

  # ── 输入模式相机参数（common.input_mode）：两流水线共用，按输入模式自动选择 ──
  input_mode:
    # camera_mode：--input camera（实机相机）。
    camera_mode:
      # 相机输入模式（CameraInputMode）extra_info 延迟（秒）：
      # 后台线程持续采样 RobotController::getState() 并维护延迟队列，返回给流水线的
      # extra_info 为相对当前时刻 extra_info_delay 前的队头数据（0.0 = 最新状态）
      extra_info_delay: 0.016527
      device_ip: "192.168.10.10"    # 相机设备 IP
      net_ip: "192.168.10.25"       # 本机网口 IP
      exposure: 2000.0              # 曝光时间（微秒）
      gain: 16.0                    # 增益
      resolution:
        width: 1280                 # 图像宽（像素）
        height: 1080                # 图像高（像素）
      # 相机内参矩阵（3x3，行优先：fx, 0, cx, 0, fy, cy, 0, 0, 1）
      camera_matrix: # 相机内参矩阵
        [1.31275979e+03, 0.00000000e+00, 6.47480874e+02,
         0.00000000e+00, 1.31284175e+03, 5.14705128e+02,
         0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
      dist_coeffs: [-0.08239928, 0.22293589, -0.00081181, 0.00018714, -0.21702634] # 畸变系数

    # video_mode：--input video / interactive（录制视频 / 交互图片，无网络/曝光参数）。
    video_mode:
      # 测试最大帧率：true 时 VideoInputMode 的 getFrameDelay() 返回 0
      # （不做按视频帧率的节流），以测得视频输入 + 流水线的最大帧数/FPS。
      test_max_fps: false
      resolution:
        width: 1920                 # 图像宽（像素）
        height: 1080                # 图像高（像素）
      # 相机内参矩阵（3x3，行优先：fx, 0, cx, 0, fy, cy, 0, 0, 1）
      camera_matrix: # 相机内参矩阵
        [1.31280460e+03, 0.00000000e+00, 6.38736364e+02,
         0.00000000e+00, 1.31309593e+03, 5.34133502e+02,
         0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
      dist_coeffs: [-0.05392145, -0.02516686, -0.00222499, -0.00149047,  0.43693918] # 畸变系数

  # ── 录制参数（--record 开启录制时生效）──
  recording:
    output_dir: "recordings"        # 录制输出目录（相对项目根目录；以 / 开头为绝对路径）
    min_free_space_mb: 16384         # 剩余空间低于该值（MB）时停止写入（0 = 不检查）

  # ── yaw 构型与**构型相关参数**（tf / 控制器；两种构型的参数互不通用）──
  # ⚠ 本段约定（本工程唯一的例外，见文件头）：按构型分为 single / big_small 两支，
  #   **只需填写当前 mode 那一支**（另一支可以整段省略，不必写）；
  #   当前构型那一支内的字段依旧全部必填——缺字段直接报错退出，不设代码默认值。
  #   mode = single    ：单 yaw（旧，TorqueController 子模组）：chassis -> yaw -> pitch
  #   mode = big_small ：大/小双 yaw（新，TorqueControllerForBigSmallYaw 子模组）：
  #                      chassis -> yaw_big -> yaw_small -> pitch
  # 本段内容按构型不同而异：
  #   tf               ：变换树各节点偏移（big_small 额外含小 yaw 轴相对大 yaw 轴的偏移）
  #   robot_controller ：控制器构造参数（single = tcs::RobotController；
  #                      big_small = tcbs::RobotController：model/mpc/estimator/mcu_linear/controller）
  #   joints / splitter：仅 big_small（关节行程与回中、大小 yaw 拆分器的大 yaw 平滑规划器）
  big_small_yaw:
    mode: single                  # 构型开关：single（旧单 yaw）| big_small（大/小双 yaw）

    # ══ 单 yaw 构型（mode = single 时必填；big_small 构型下可整段省略）══
    single:
      # ── 变换树各节点相对其父节点的固定偏移（单位：米）──
      tf:
        yaw_joint_z_offset: 0.0      # yaw 关节沿 z 轴偏移（相对 chassis）（实际上为pitch轴关节相对底盘最低点高度）
        pitch_joint_y_offset: 0.0     # pitch 关节沿 y 轴偏移（相对 yaw 旋转中心）
        imu_offset_x: 0.0             # imu 相对 head 的 x 偏移 // head 节点实际上为 picth轴 和 一个垂直于picth轴且经过yaw轴的面 的交点位置
        imu_offset_y: 0.0           # imu 相对 head 的 y 偏移
        imu_offset_z: 0.0            # imu 相对 head 的 z 偏移
        camera_offset_x: 0.0          # camera 相对 head 的 x 偏移
        camera_offset_y: 0.0          # camera 相对 head 的 y 偏移
        camera_offset_z: 0.0          # camera 相对 head 的 z 偏移
        muzzle_offset_x: 0.0          # muzzle 相对 head 的 x 偏移
        muzzle_offset_y: 0.0         # muzzle 相对 head 的 y 偏移
        muzzle_offset_z: 0.0          # muzzle 相对 head 的 z 偏移

      # ── RobotController（TorqueController 子模组）构造参数 ──
      robot_controller:
        sequence_mode: true         # 序列输入模式（true=序列 set / false=单目标 set）
        yaw_torque_only_mode: false # 仅力矩控制模式（false=正常发送角度/速度目标；true=仅发送 yaw 力矩控制，用于调参/测试）
        dt_control: 0.01            # 控制周期（秒，100Hz）
        mpc_pred_n: 20              # MPC 预测步数
        J: 0.024986                 # yaw 轴转动惯量
        tau_c: 0.122514             # 库仑摩擦
        b: 0.025648                   # 粘滞摩擦系数
        tau_d: 0.0                  # 常数扰动
        max_torque: 1.0             # 最大力矩（N·m）
        max_torque_rate: 40.0       # 最大力矩变化率（N·m/s）
        Q: 1.0                      # MPC 状态代价
        R: 0.01                     # MPC 控制代价
        Rd: 1.0                     # MPC 控制变化率代价
        max_iter: 30                # MPC 迭代上限
        integral_gain: 1.0         # yaw 力矩积分补偿比例系数
        smooth_eps: 1e-6           # 位置跟踪误差平滑绝对值常数 a（代价 = Q*sqrt(err²+a)，很小的正数）
        # ── MCU 数据线性映射标定参数（McuDataPreprocessor::LinearParams，当前标定默认值）──
        send_pitch_scale: 20.523245    # imu_euler_pitch → pitch_target_angle（发送）
        send_pitch_offset: 0.475049    # 发送偏移
        recv_pitch_scale: 1.122635     # mcu_pitch_angle → imu_euler_pitch（接收）
        recv_pitch_offset: -0.170755   # 接收偏移

  # ── 云台解算参数 ──
  gimbal:
    bullet_diameter: 0.017       # 弹丸直径（米）
    bullet_mass: 0.0032          # 弹丸质量（kg）
    bullet_velocity: 20.0        # 默认弹丸初速（m/s，可在运行时通过 setBulletVelocity 覆盖）
    integration_step: 0.01       # 弹道积分步长（秒）
    distance_threshold: 0.05     # 弹道最近点距离阈值（米），最短距离超过则解算失效
    distance_iterate_threshold: 0.01  # 迭代触发阈值（米）：首轮最近距离大于该值则触发 yaw-pitch 迭代优化；最终距离小于 distance_threshold 才算成功
    stop_z: -3.0                 # 弹道计算截止高度（world 系，米），弹丸低于该高度即停止积分
    pitch_min: -0.5236 # -30°             # pitch 搜索下界（弧度）
    pitch_max: 0.7854 # 45°               # pitch 搜索上界（弧度）
    pitch_search_step: 0.01745 # 1°      # pitch 粗搜索步长（弧度）

  # ── 预测弹道解算参数 ──
  predicted_ballistic:
    extra_predict_time: 0.0      # 额外预测时间（秒），叠加在弹道飞行时间之上 # 待调
    max_iterations: 5             # 飞行时间迭代上限
    time_error_tolerance: 0.005    # 迭代提前停止的时间误差容差（秒）


  # ── 预测序列参数（序列输入模式：预测序列生成与消费）──
  predict_sequence:
    prediction_points: 5             # M：预测点数（实际精确弹道解算的点数）
    interpolation_refine: 5          # K：插值细化倍数（相邻实际计算点之间细分的返回点间隔数）
                                     # 原划分序列点数 = (M-1)*K+1 = 21，间隔恰为 dt_control，
                                     # 首末点必为实际计算点
    exact_lead_points: 3             # n：前导精确点数——在序列最前面拼接 n 个逐点精确弹道
                                     # 解算的前导点（不用插值），0 = 关闭（行为与原版一致）。
                                     # 返回序列 = [前导精确点] + [原划分序列]，
                                     # 总返回点数 = (M-1)*K+1+n，精确解算点共 M+n 个，
                                     # 时间间隔全程均匀为 dt_control。
                                     # 原划分首段（紧邻窗口 n+1..n+K-1）需要外推时参考点改用
                                     # items[n-1]（须与段左端点同目标，否则复制左端点），
                                     # 其余段仍用原规则。取值范围 n >= 0。
                                     # 例：M=6、K=4、n=3 → 索引 0,1,2 为前导精确点；
                                     # 索引 3 起为原划分序列（实际点 3,7,11,15,19,23，共 24 点）。
    pitch_seq_lead: 5               # m：pitch 序列提前数（必须小于总返回点数 (M-1)*K+1+n），pitch 序列截取第 m 个之后
    fire_seq_lead: 5                 # o：fire 序列提前数，fire 序列截取第 o 个之后
    pitch_bias: 0.0             # pitch 轴偏置（弧度），输出时叠加
    yaw_bias: 0.0                    # yaw 轴偏置（弧度），输出时叠加
    fire_angle_lower_limit: 0.0  # 0° # fire 判定角度阈值下限（弧度）
    fire_angle_length: 0.05          # fire 判定弧长（米）：动态阈值 = length / 目标与 yaw 原点 xy 距离
    aim_stick_ratio: 0.1             # 瞄准点滞回幅度系数（无单位，>=0；0 = 关闭）：SequencePredictor 在
                                     # “慢目标”帧启用瞄准点滞回时，滞回量 = ratio × (t=0 全部瞄准点到
                                     # 预测车体中心的平均距离)。
                                     # 慢目标判定（施密特触发器，阈值 armor.target_selection 的
                                     # slow_angular_velocity_*）在 SequencePredictor::predict 内完成。
    min_rotation_tolerance_angle: 0.05   # 旋转容差角下限（弧度，>=0）：fast_target 帧下每个预测瞄准点的
                                     # 旋转容差角 = max(本值, fire_angle_length / 该点的旋转半径)；
                                     # 旋转半径 = (同时刻预测车体中心 − 该预测瞄准点) 的 xy 投影长度。
                                     # 半径趋零时容差角会发散，用本值兜底（同时给出最小可打角度窗口）。

# ════════════════════════════════════════════════════════════
# armor — Armor 流水线独占参数
# ════════════════════════════════════════════════════════════
armor:
  inference:
    model: "0526"  # 选择 0526 或 0726；切换后重启主程序和推理进程
    device: "GPU"                          # 推理设备（CPU / GPU / ...）
    shm_key: 23301                         # 共享内存 Key（与 armor_infer_process 通信，两进程须一致）
    models:
      "0526":
        model_path: "Model/Armor/0526_dynamic.onnx"  # 模型路径（相对项目根目录；以 / 开头则为绝对路径）
        max_batch: 1                           # 推理最大批量（动态 batch 1..max_batch；值越大编译/预热越多，须 ≤ 模型可支持上限）
        resolution:                            # YOLO 推理输入分辨率（像素），须与模型输入一致
          width: 640                           # 输入图像宽（像素）
          height: 640                          # 输入图像高（像素）
      "0726":
        # width/height 为32的正整数倍；当前共享内存要求 width*height <= 640*640
        model_path: "Model/Armor/0726_dynamic.onnx"
        max_batch: 1  # 动态 batch；实际批量由 armor.pipeline.inference_batch 决定（当前容量最多4）
        resolution:
          width: 512
          height: 512
  observation_lost_timeout: 2.0   # 连续多久未观测到目标则重置 OutpostESEKF / 最新物体位姿保持（秒）

  # ── 目标选取滞回参数（armor.target_selection）──
  #   stage5_stick_priority_m：stage5 目标级滞回固定优先度（米）——上一帧选中的目标
  #     （filter/label）在再次选取时减去该米数参与“距底盘原点最近”比较，其它目标须
  #     明显更近才切换（避免多目标来回切换；与角速度无关）。0 = 关闭。
  #   慢目标施密特触发器（slow_angular_velocity_lower/upper，rad/s）：目标自身角速度
  #     |ω| 低于 lower 判定为“慢目标”（瞄准点滞回允许），高于 upper 判定为快目标，
  #     介于两者之间保持上一帧判定（防抖，无连续帧计数）。判定在 SequencePredictor::
  #     predict 内完成，本段只提供阈值：ArmorPipeline 只下发目标角速度原始值（带正负）
  #     及其可用标志（前哨站=esekf yaw_rate、label 0~5=ClassEKF 的 w 时有效；基地
  #     label 7/8 及角速度当前不可用时标志为 false、角速度填 0）。标志为 false 时
  #     不判定 → 不滞回（PowerRune 等无角速度来源同此）；标志为 true 时即使角速度
  #     恰为 0 也按正常阈值判定（判定为慢目标）。
  #   快目标施密特触发器（fast_angular_velocity_lower/upper，rad/s；须
  #     slow_angular_velocity_upper < lower < upper）：|ω| 高于 upper 判定为
  #     fast_target——整条预测序列改为对“即将与枪线对齐的那块装甲板”做单点解算
  #     （对齐时刻 = 该点总预测时间 + |中心瞄准夹角|/|ω|），并在火控数组上额外
  #     按匀速旋转模型判定“是否有板在枪线上”，两个条件同时满足才开火；低于 lower
  #     退出 fast_target，介于两者保持上一帧判定。角速度不可用的目标不判定。
  target_selection:
    stage5_stick_priority_m: 0.5
    slow_angular_velocity_lower: 0.5
    slow_angular_velocity_upper: 1.0
    fast_angular_velocity_lower: 2.0
    fast_angular_velocity_upper: 3.0

  # ── 流水线缓冲队列与批量参数（armor.pipeline）──
  # 缓冲队列长度 + 可批处理阶段（1 预处理 / 2 推理 / 3 后处理）的最大批量。
  # 阶段4（PnP）/ 阶段5（OutpostESEKF）为单帧处理，批量固定为 1。
  pipeline:
    # 6 个缓冲队列最大长度（[输入, 阶段间×4, 输出]）；队列满时新帧直接丢弃。
    queue_max_sizes: [10, 10, 10, 10, 10, 10]
    preprocess_batch: 4    # 阶段1 预处理最大批量
    inference_batch: 1     # 阶段2 推理最大批量（动态批量 1..inference_batch；
                           #   须 ≤ inference.max_batch，且 ≤ 共享内存容量 4）
    postprocess_batch: 4   # 阶段3 后处理最大批量

  # ── OutpostESEKF 误差状态扩展卡尔曼滤波参数 ──
  outpost_esekf:
    position_noise: 100.0         # 位置过程噪声（Q 位置块）
    rotation_noise: 10.0          # 姿态过程噪声（Q 姿态块）
    measurement_noise: 40.0      # 观测噪声（重投影误差 R）
    orientation_z_reg_noise: 0.0001  # 姿态 z 轴正则化观测噪声
    dz_noise: 0.1                 # dz 偏移过程噪声（Q(7,7)/Q(8,8)）
    dz_search_range: 0.5          # dz 黄金分割搜索范围（米）
    dz_limit: 0.3                 # dz 偏移限幅（米，|dz| 上限）
    init_position_noise: 1.0      # 初始化位置噪声系数（P 位置块）
    init_orientation_noise: 0.1   # 初始化姿态噪声系数（P 姿态块）
    init_yaw_rate_noise: 1.0      # 初始化旋转速度不确定性（P(6,6)）
    init_dz2_noise: 0.01          # 初始化 dz2 不确定性（P(7,7)）
    init_dz3_noise: 0.01          # 初始化 dz3 不确定性（P(8,8)）

  # ── SuperPower EKF（sp_ekf::ClassEKF，label 0~5 每类一个）滤波参数 ──
  # 字段与 ClassEKF::Params 一一对应，经 ClassEKF::buildConfig 组装成原接口
  # （SuperPowerPredictor）的 YAML 配置节点下发；改动后仅需重启程序，无需重新编译。
  super_power_ekf:
    observation_lost_timeout_sec: 2.0   # 连续无观测多久后自动销毁内部目标（秒）
    initial_radius_m: 0.2               # SP 普通四装甲初始半径（米）
    joint_update_enabled: true          # 双板（联合）观测更新开关
    min_detect_count: 5                 # 最小识别帧数（DETECTING→TRACKING）
    max_temp_lost_count: 15             # 临时失检最大帧数（超过转 LOST 重建）
    max_dt_s: 0.1                       # 最大帧间隔（秒，超过视为时间不连续）
    armor_num: 4                        # 装甲板数量（普通四装甲=4）
    # ── 角速度（车体旋转 w）滑窗最小二乘拟合参数 ──
    angular_velocity_fit:
      window_s: 0.50                    # 拟合滑窗（秒，须 >= 0.02）
      min_samples: 10                    # 拟合最少样本数（须 >= 2）
    # ── 双板（联合）观测更新门控参数 ──
    joint_update:
      max_joint_nis: 20.09              # 联合 NIS 门控阈值
      max_secondary_position_error_m: 0.45  # 副板最大位置误差门控（米）
      max_secondary_angle_error_rad: 0.80   # 副板最大角度误差门控（弧度）
      measurement_variance_scale: 1.5       # 联合更新位置方差放大系数
      angle_variance_scale: 4.0             # 联合更新角度方差放大系数

# ════════════════════════════════════════════════════════════
# power_rune — PowerRune 流水线独占参数
# ════════════════════════════════════════════════════════════
power_rune:
  inference:
    model_path: "Model/PowerRune/power_rune_finetune.onnx"  # 模型路径（相对项目根目录；以 / 开头则为绝对路径）
    device: "GPU"                                       # 推理设备（CPU / GPU / ...）
    max_batch: 4                # 推理最大批量
    shm_key: 23302              # 共享内存 Key（与 power_rune_infer_process 通信，两进程须一致）
    resolution:                                         # YOLO 推理输入分辨率（像素），须与模型输入一致
      width: 512                                        # 输入图像宽（像素）
      height: 512                                       # 输入图像高（像素）
    manual_nms: false            # true: 模型为无 NMS 的原始输出，需手动 NMS；false: NMS 已内嵌
    conf_threshold: 0.5         # 置信度阈值

  # ── 流水线缓冲队列与批量参数（power_rune.pipeline）──
  # 缓冲队列长度 + 可批处理阶段（1 预处理 / 2 推理 / 3 后处理）的最大批量。
  # 阶段4（位姿解算）/ 阶段5（滤波+预测）为单帧处理，批量固定为 1。
  pipeline:
    # 6 个缓冲队列最大长度（[输入, 阶段间×4, 输出]）；队列满时新帧直接丢弃。
    queue_max_sizes: [10, 10, 10, 10, 10, 10]
    preprocess_batch: 4    # 阶段1 预处理最大批量
    inference_batch: 4     # 阶段2 推理最大批量（动态批量 1..inference_batch；
                           #   须 ≤ inference.max_batch，且 ≤ 共享内存容量 4）
    postprocess_batch: 4   # 阶段3 后处理最大批量

  # ── 第一级滤波 YAxisFilter（power_rune.y_axis_filter）──
  # 全部参数在此配置，代码内无默认值（缺失/非法则启动报错）。
  #   alpha_*          ：轴倾斜 / 绕轴自旋 / 位置 / 角速度 与正则化增益；
  #   jump_angle_threshold_rad ：预测与观测姿态绕 Y 轴最小夹角超过该值（或本帧非连续）
  #                              即触发特殊预测（±2π/5 整数倍偏移搜索，旧式为 π/5）；
  #   special_search_range / special_search_range_with_predictor ：
  #                      特殊预测偏移系数 a 的搜索半范围（基准分别为正常预测姿态 /
  #                      RollPredictor 预测姿态）；
  #   anomaly_abs_limit ：输入/状态分量绝对值上限（NaN/±inf 同样视为异常）；
  #   pos_xy_radius_m / pos_z_half_range_m ：位置坐标限位（相对当帧底盘 world 位置，
  #                      0 = 关闭限位）。
  y_axis_filter:
    alpha_slow: 0.05                 # 轴倾斜（垂直方向）增益
    alpha_fast: 1.0                  # 绕轴自旋（平行方向）增益
    alpha_pos: 0.05                  # 位置更新增益
    alpha_omega: 0.05                # 角速度更新增益
    alpha_reg: 1.0                   # 正则化增益（0 = 禁用）
    jump_angle_threshold_rad: 0.6283185307179586   # 跳变判定阈值（弧度，π/5）
    special_search_range: 1                         # 正常预测基准下的偏移搜索半范围
    special_search_range_with_predictor: 2          # RollPredictor 预测基准下的半范围
    anomaly_abs_limit: 1000000.0     # 异常值绝对值上限
    pos_xy_radius_m: 16.0            # xy 限位圆半径（米，0 = 关闭）
    pos_z_half_range_m: 5.0          # z 相对底盘高度的半范围（米，0 = 关闭）

  # ── 第二级拟合预测 RollPredictor（power_rune.roll_predictor）──
  # 模型：BIG   r(t) = sign·(-a/ω·cos(ω(t+o_t)) + (big_linear_coefficient - a)(t+o_t))
  #       SMALL r(t) = sign·k(t+o_t)
  #   loose_fit = true : SMALL 一并最小二乘拟合斜率（不再固定 small_slope_fixed）；
  #                      BIG 使用 loose 一组参数范围；
  #   loose_fit = false: SMALL 固定斜率 small_slope_fixed；BIG 使用 strict 一组范围。
  # 全部参数在此配置，代码内无默认值。
  roll_predictor:
    loose_fit: false
    max_time_window_s: 5.0          # 队列中数据的最长保留时间（秒）
    min_data_points: 20             # 进行拟合所需的最小数据点数
    queue_time_threshold_s: 1.0     # 队列时间跨度最小阈值（秒）
    correction_window: 5            # 修正偏置所用的最新数据点数
    grid_search_interval_s: 0.5     # 两次完整网格搜索的最小间隔（秒，≤0 = 每帧搜索）
    visualization_samples: 200      # 可视化拟合曲线采样点数（仅影响绘图）
    ceres_max_iterations: 50        # Ceres 精化最大迭代次数
    ceres_function_tolerance: 1.0e-6 # Ceres 收敛的残差变化容差
    big_linear_coefficient: 2.090   # BIG 模型线性项系数（旧实现中的 2.090）
    big_omega_step: 0.005           # BIG 网格搜索 ω 步长
    big_ot_step: 0.05               # BIG 网格搜索 o_t 步长
    small_slope_fixed: 1.0471975511965976    # SMALL 固定斜率（π/3，loose_fit=false 时使用）
    unwrap_threshold_rad: 1.5707963267948966 # 相位连续化跨 ±π 判定的半周期阈值（弧度，π/2）
    strict:                         # loose_fit = false 时使用
      a_min: 0.780
      a_max: 1.045
      omega_min: 1.884
      omega_max: 2.000
    loose:                          # loose_fit = true 时使用
      a_min: 0.1
      a_max: 1.045
      omega_min: 1.826
      omega_max: 2.058

  # ── 级联阈值（power_rune.cascade）──
  # 连接两级滤波/预测与上游位姿观测的阈值（原先硬编码在流水线内）。
  cascade:
    continuity_threshold_s: 0.1     # 帧间 dt 小于该值视为连续帧
    roll_rmse_gate: 0.3             # RollPredictor 预测矩阵可用于特殊预测的 RMSE 门限
    reset_timeout_s: 3.0            # 连续无有效观测超过该秒数则重置两级滤波/预测器

  # ── 预测点选取决策器（power_rune.target_selection）──
  # 靶点预测恒输出全部 5 个靶点（列表下标 = 旋转计数），本帧不存在的靶点被 mask。
  # PredictedPointSelector 为每个靶点维护状态机：
  #   未被观测 --(未被 mask)--> 观测建立中 --(连续 establish_duration_s)--> 已观测到
  #   已观测到 --(被 mask)--> 临时丢失 --(连续 lost_timeout_s 被 mask)--> 未被观测；
  #   临时丢失重新变为未被 mask 时直接回到已观测到（不重新计时）。
  #   特殊规则：未被 mask 的已观测点达到 2 个及以上时，被 mask 的临时丢失点立即
  #   回到未被观测。候选 = 已观测到 ∪ 临时丢失；优先粘滞上一次选中的目标，否则取
  #   候选中预测高度最低者。
  target_selection:
    establish_duration_s: 0.1   # a：由“观测建立中”转为“已观测到”所需连续未被 mask 的秒数
    lost_timeout_s: 0.3         # b：由“临时丢失”转回“未被观测”所需连续被 mask 的秒数
