# =============================================================================
# auto_launch/auto_launch.conf — 自启动/看门狗的唯一配置
#
# 本文件把「运行主程序的命令行」以及看门狗、systemd 服务的全部参数集中在一处：
#   auto_launch/watchdog.py        读 [launch] + [watchdog]（看门狗本体，也可 --run 直接跑）
#   auto_launch/install_service.py 读 [launch] + [watchdog] + [service]（安装 systemd 服务）
# 改完本文件：手动运行时下次启动生效；systemd 服务用
#   sudo systemctl reload unified_auto_aim.service   （等价于重启子进程，见 ExecReload）
# 或 sudo systemctl restart unified_auto_aim.service
#
# 语法：INI。'#' 或 ';' 开头为注释；值不要加引号；多行值用缩进的续行（见 preamble）。
# =============================================================================

[launch]
# ── 运行主程序的命令行（唯一来源：改这里即可，无需改任何代码）────────────────
# 工作目录固定为 project_root（见下），shell 用 shell 指定。
# 当前推荐（复用 launch_all.py 的「先起推理进程并等就绪 + 共享内存清理」逻辑，
# 与 config 里 infer_process_lazy: false 的机器一致）：
command = python3 launch_all.py --pipeline armor --input camera --output gimbal

# 其它常用组合（按需替换上面的 command）：
#   command = python3 launch_all.py --pipeline armor --input camera --output gimbal+visualize
#   command = python3 launch_all.py --pipeline power_rune --input camera --output gimbal
#   command = python3 launch_all.py --pipeline armor --input camera --output none --record
# config 里 infer_process_lazy: true 的机器（如 Infantry1）也可以直接跑主程序本体：
#   command = ./bin/unified_auto_aim --pipeline armor --input camera --output gimbal

# ── 启动前先执行的 shell 片段（可多行，逐行执行；留空表示不执行）──
# 需要 ROS / 额外环境变量时写在这里，例如：
#   preamble = source /opt/ros/humble/setup.bash
#              export SOME_VAR=1
preamble =

# 执行 command 用的 shell（绝对路径）
shell = /bin/bash

# 项目根目录：相对本文件（auto_launch/）所在目录解析，默认 ".." 即项目根。
project_root = ..

# ── 子进程退出后的重启策略 ──
#   always     ：任何退出（含正常退出、视频播完、按 q 退出）都重启 ← 相机自启动用这个
#   unexpected ：仅非 0 退出或被信号杀死时重启
restart_policy = always

[watchdog]
# ── 判活 ──
# 喂狗通道：主程序（common/Debug/WatchdogFeed）向下面这个 Unix 域套接字周期上报；
# 超过 feed_timeout_sec 没收到就判定卡死并重启进程组。
# 注意：仅当主程序本次构建包含 WatchdogFeed 时才生效（旧二进制收不到心跳）；
#       此时把 heartbeat_enabled 设为 false，退化为「只按进程存活重启」。
heartbeat_enabled = true
socket_path = /tmp/unified_auto_aim_watchdog.sock
feed_timeout_sec = 20            # 喂狗超时（秒）
connect_timeout_sec = 30         # 启动后等待首次喂狗的最长时间（秒）

# ── 生命周期 ──
shutdown_grace_sec = 5           # 先发 SIGINT，超过该时长仍未退出则对进程组 SIGKILL
restart_delay_sec = 3            # 重启前的等待
restart_backoff_max_sec = 30     # 连续快速失败时退避上限（每失败一次翻倍）
healthy_run_sec = 30             # 连续运行超过该时长即认为稳定，退避计数清零
max_restarts = 0                 # 0 = 无限重启；>0 时达到次数后退出（调试用）

# ── 传给主程序的喂狗参数（环境变量 WATCHDOG_*，含义见 include/common/Debug/WatchdogFeed.h）──
feed_period_ms = 500             # 上报周期
stall_timeout_ms = 10000         # 连续该时长没有新帧就停止喂狗，让看门狗重启（<=0 关闭帧门控）
boot_grace_ms = 10000            # 上电到第一帧的最长允许时间，超时则停止喂狗（<=0 不限制）

# ── 日志 ──
log_file = logs/watchdog.log     # 相对项目根；留空 = 只输出到 stdout（systemd 记入 journal）
log_max_bytes = 5242880          # 超过该大小轮转一次为 watchdog.log.1
log_level = info                 # debug | info | warn | error

[service]
# systemd 服务名与描述
name = unified_auto_aim.service
description = Unified Auto-Aim Pipeline (auto_launch watchdog)
# 额外依赖（可留空）。机器人上若要把相机/USB 设备就绪也纳入依赖，可加设备单元，例如
#   after = network-online.target dev-ttyACM0.device
after = network-online.target
wants = network-online.target
# 服务进程环境变量（多行各占一行，KEY=VALUE）
environment = PYTHONUNBUFFERED=1
restart_sec = 3                  # systemd RestartSec（看门狗自身异常退出后的重启间隔）
timeout_stop_sec = 20            # systemd 停止服务时的宽限（要大于 shutdown_grace_sec）
